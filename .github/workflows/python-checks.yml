name: Python checks

on:
  push:
    branches: [main, web-rebuild]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q donmulwon2 tests
      - name: Run indicator unit tests
        run: python -m unittest discover -s tests -v
      - name: Extract and validate isolated Neoburi artwork
        run: |
          python tools/extract_art_sheets.py
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          path = Path('assets/characters/neoburi/neoburi.png')
          assert path.is_file(), 'Transparent Neoburi image was not generated'
          with Image.open(path) as image:
              assert image.mode == 'RGBA', f'Expected RGBA, got {image.mode}'
              assert image.width > 0 and image.height > 0
              alpha = image.getchannel('A')
              assert alpha.getbbox() is not None, 'Character alpha is empty'
              assert alpha.getpixel((0, 0)) == 0, 'Top-left background is not transparent'
              assert alpha.getpixel((image.width - 1, image.height - 1)) == 0, 'Bottom-right background is not transparent'
              dimensions = image.size
          print(f'Isolated Neoburi PNG OK: {dimensions}')
          PY
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - name: Import GUI modules
        run: python -c "from donmulwon2.dashboard import Dashboard; print('GUI imports OK')"
      - name: Smoke test dashboard construction and paint
        run: |
          python - <<'PY'
          from PySide6.QtWidgets import QApplication
          from donmulwon2.dashboard import MainWindow

          app = QApplication([])
          window = MainWindow()
          window.resize(1600, 900)
          window.show()
          from PySide6.QtCore import QEventLoop, QTimer
          app.processEvents()
          screenshot = window.grab()
          assert not screenshot.isNull(), "Dashboard screenshot is empty"
          dashboard = window.centralWidget()
          assert dashboard.isVisible()
          assert dashboard.image.width() == 1672
          assert dashboard.image.height() == 941
          assert dashboard._to_canvas(10, 10) is not None
          assert not dashboard.character_image.isNull(), "Static transparent Neoburi image did not load"
          dashboard.refresh_timer.stop()
          dashboard.clock.stop()
          window.close()
          app.processEvents()
          print("Dashboard paint + static transparent Neoburi OK", flush=True)
          # pykrx currently triggers a C-extension finalizer abort on some Linux
          # runners; all GUI assertions have completed before this clean test exit.
          import os
          os._exit(0)
          PY
