name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q donmulwon2 tests
      - name: Run indicator unit tests
        run: python -m unittest discover -s tests -v
      - name: Extract and validate artwork sprite sheets
        run: |
          python tools/extract_art_sheets.py
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          sprites = sorted(Path('assets/characters/neoburi/frames').glob('pose_*.png'))
          scenes = sorted(Path('assets/backgrounds/scenes').glob('scene_*.png'))
          assert len(sprites) == 20, f'Expected 20 character frames, got {len(sprites)}'
          assert len(scenes) == 9, f'Expected 9 office scenes, got {len(scenes)}'
          with Image.open('assets/Gemini_Generated_Image_f889qsf889qsf889.jpg') as source:
              expected_sprite_size = (
                  (source.width + 4 - 1) // 4,
                  (source.height + 5 - 1) // 5,
              )
          with Image.open('assets/Gemini_Generated_Image_f889qsf889qsf889 (1).jpg') as source:
              expected_scene_size = (
                  (source.width + 3 - 1) // 3,
                  (source.height + 3 - 1) // 3,
              )
          for path in sprites:
              with Image.open(path) as image:
                  assert image.mode == 'RGBA', f'{path} is not RGBA'
                  assert image.size == expected_sprite_size, (
                      f'Unexpected frame size: {path} {image.size}; '
                      f'expected {expected_sprite_size}'
                  )
          for path in scenes:
              with Image.open(path) as image:
                  assert image.mode == 'RGB', f'{path} is not RGB'
                  assert image.size == expected_scene_size, (
                      f'Unexpected scene size: {path} {image.size}; '
                      f'expected {expected_scene_size}'
                  )
          print(
              f'Artwork extraction OK: 20 RGBA character frames '
              f'{expected_sprite_size} + 9 RGB scenes {expected_scene_size}'
          )
          PY
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - name: Import GUI modules
        run: python -c "from donmulwon2.dashboard import Dashboard; print('GUI imports OK')"
      - name: Smoke test dashboard construction and paint
        run: |
          python - <<'PY'
          from PySide6.QtWidgets import QApplication
          from donmulwon2.dashboard import MainWindow

          app = QApplication([])
          window = MainWindow()
          window.resize(1600, 900)
          window.show()
          app.processEvents()
          screenshot = window.grab()
          assert not screenshot.isNull(), "Dashboard screenshot is empty"
          dashboard = window.centralWidget()
          assert dashboard.isVisible()
          assert dashboard.image.width() == 1672
          assert dashboard.image.height() == 941
          assert dashboard._to_canvas(10, 10) is not None
          dashboard.refresh_timer.stop()
          dashboard.clock.stop()
          window.close()
          app.processEvents()
          print("Pixel-art canvas construction and paint OK", flush=True)
          # pykrx currently triggers a C-extension finalizer abort on some Linux
          # runners; all GUI assertions have completed before this clean test exit.
          import os
          os._exit(0)
          PY
