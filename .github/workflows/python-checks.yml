name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q donmulwon2 tests
      - name: Run indicator unit tests
        run: python -m unittest discover -s tests -v
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - name: Import GUI modules
        run: python -c "from donmulwon2.dashboard import Dashboard, TechnicalChart; print('GUI imports OK')"
      - name: Smoke test dashboard construction and paint
        run: |
          python - <<'PY'
          from PySide6.QtWidgets import QApplication
          from donmulwon2.dashboard import MainWindow

          app = QApplication([])
          window = MainWindow()
          window.resize(1600, 900)
          window.show()
          app.processEvents()
          screenshot = window.grab()
          assert not screenshot.isNull(), "Dashboard screenshot is empty"
          assert window.centralWidget().market_panel.isVisible()
          window.close()
          print("Dashboard construction and paint OK")
          PY
